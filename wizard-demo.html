<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trip Architect Wizard — Tayrona Guide (Module Demo)</title>
  <meta name="description" content="Interactive trip planning wizard for Santa Marta & Tayrona area. Build your stay, choose tours and transfers.">

  <!-- Google Fonts (same as parent site) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- Wizard Module CSS -->
  <link rel="stylesheet" href="wizard-module.css">

  <style>
    /* Minimal shell styles for standalone demo */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #071510;
      color: #f1f5f9;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
    }

    /* Demo Header */
    .demo-header {
      background: rgba(7, 21, 16, 0.92);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255,255,255,0.07);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    .demo-logo {
      font-family: 'Outfit', sans-serif;
      font-size: 1.1rem;
      font-weight: 800;
      color: #f1f5f9;
    }
    .demo-logo span { color: #10b981; }
    .demo-badge {
      background: rgba(16, 185, 129, 0.12);
      color: #10b981;
      border: 1px solid rgba(16,185,129,0.25);
      border-radius: 100px;
      padding: 4px 14px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    /* Language switcher demo */
    .demo-lang-bar {
      background: rgba(0,0,0,0.2);
      border-bottom: 1px solid rgba(255,255,255,0.05);
      padding: 10px 24px;
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .lang-pill {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 100px;
      padding: 5px 14px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      color: #94a3b8;
      transition: all 0.2s;
      font-family: 'Inter', sans-serif;
    }
    .lang-pill:hover, .lang-pill.active {
      background: rgba(16,185,129,0.15);
      border-color: rgba(16,185,129,0.4);
      color: #10b981;
    }

    /* Demo note */
    .demo-note {
      text-align: center;
      padding: 12px 24px;
      font-size: 0.75rem;
      color: #64748b;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .demo-note a { color: #10b981; }

    @media print {
      .demo-header, .demo-lang-bar, .demo-note { display: none; }
      body { background: #fff; color: #1e293b; }
    }
  </style>
</head>
<body>

  <!-- Demo Shell Header -->
  <header class="demo-header">
    <div class="demo-logo">🌿 Tayrona<span>Guide</span></div>
    <div class="demo-badge">Wizard Module — Standalone Demo</div>
  </header>

  <!-- Language Switcher (demo only) -->
  <div class="demo-lang-bar">
    <button class="lang-pill active" data-lang="en">🇬🇧 English</button>
    <button class="lang-pill" data-lang="es">🇪🇸 Español</button>
    <button class="lang-pill" data-lang="it">🇮🇹 Italiano</button>
    <button class="lang-pill" data-lang="fr">🇫🇷 Français</button>
    <button class="lang-pill" data-lang="de">🇩🇪 Deutsch</button>
  </div>

  <div class="demo-note">
    📦 <strong>Standalone module demo.</strong>
    To embed in the main site: add <code>&lt;div id="trip-wizard-mount"&gt;&lt;/div&gt;</code> in your HTML and call <code>TripWizard.init('#trip-wizard-mount')</code>.
    <a href="wizard-module.js">wizard-module.js</a> · <a href="wizard-module.css">wizard-module.css</a>
  </div>

  <!-- ===== WIZARD MOUNT POINT ===== -->
  <div id="trip-wizard-mount"></div>

  <!-- Wizard Module JS -->
  <script src="wizard-module.js"></script>
  <script>
    // Initialize the wizard
    TripWizard.init('#trip-wizard-mount');

    // Language switcher demo
    document.querySelectorAll('.lang-pill').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.lang-pill').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        TripWizard.setLang(btn.dataset.lang);
      });
    });
  </script>
</body>
</html>
